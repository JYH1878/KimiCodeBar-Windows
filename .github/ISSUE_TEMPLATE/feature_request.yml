name: ✨ 功能请求
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先讲场景和痛点，再讲方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 期望的方案（可选）
      description: 你设想中它应该怎么工作
